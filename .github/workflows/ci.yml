# Corre en cada push a main y en cada pull request. Vercel publica igual, pero
# un check en rojo en el PR avisa que no hay que mergear.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Clave de ejemplo solo para que compile (no es secreta ni da acceso a nada).
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      API_URL: https://example.invalid/api/v1
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
